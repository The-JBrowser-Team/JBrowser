<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="{{root}}favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="{{root}}static/img/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="{{root}}static/img/icons/favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="{{root}}static/img/icons/favicon-192.png">
<link rel="icon" type="image/svg+xml" href="{{root}}static/img/logo.svg">
<link rel="apple-touch-icon" href="{{root}}static/img/icons/apple-touch-icon.png">
<link rel="manifest" href="{{root}}site.webmanifest">
<meta name="theme-color" content="#8a5cff">
<meta name="application-name" content="JBrowser">
<meta property="og:type" content="website">
<meta property="og:site_name" content="JBrowser">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
{{head_extra}}
<meta name="color-scheme" content="light dark">
<meta name="jb-repo" content="{{repo}}">
<meta name="jb-latest" content="{{latest_version}}">
<script>
  /* Theme before first paint: the saved choice, else the system's. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("jb-theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    /* Elements that fade in as you scroll (home.css, .js-reveal) start hidden from the very first paint:
       hiding them only once home.js runs meant that on a first visit the browser could skip the hidden
       state altogether, and nothing faded in. If home.js never runs, everything simply shows. */
    try {
      if ("IntersectionObserver" in window && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("js-reveal");
        setTimeout(function () {
          if (!window.jbRevealReady) document.documentElement.classList.remove("js-reveal");
        }, 4000);
      }
    } catch (e) {}
    /* The logo in the top bar catches the light once per visit (site.css, .logo-shine). */
    try {
      if (!sessionStorage.getItem("jb-shine")) {
        sessionStorage.setItem("jb-shine", "1");
        document.documentElement.classList.add("logo-shine");
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="{{root}}static/css/site.css">
