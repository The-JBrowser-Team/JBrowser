# Builds the website with tools/build_site.py and publishes it with GitHub Pages:
# on pushes to main that touch the site, the docs, the changelog or the code, and when started by hand or
# by tools/release.ps1 after publishing a release (so the download buttons and the documentation versions
# follow at once). There is no release trigger: a release event runs on its tag, and the github-pages
# environment only deploys from main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/build_site.py"
      - "requirements-site.txt"
      - "CHANGELOG.md"
      - "jbrowser/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main              # the newest site and docs
          fetch-depth: 0         # every tag: each release gets its own documentation

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Install Markdown and Pygments
        run: python -m pip install -r requirements-site.txt

      - name: Build the website
        run: python tools/build_site.py --out _site
        env:
          GITHUB_TOKEN: ${{ github.token }}   # release sizes and dates from the GitHub API
          JBROWSER_SITE_URL: ${{ vars.SITE_URL }}   # the site's own domain (https://jbrowser.app/) once set up

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tell Bing and the other IndexNow search engines about the pages (only on the site's own domain).
  indexnow:
    needs: deploy
    if: vars.SITE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: tools/indexnow.py
          sparse-checkout-cone-mode: false
      - name: Send the sitemap to IndexNow
        run: sleep 60 && python3 tools/indexnow.py "${{ vars.SITE_URL }}sitemap.xml"
